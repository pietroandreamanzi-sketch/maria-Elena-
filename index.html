<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battesimo e 1° Compleanno di Maria Elena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fcf9f2;
            color: #5a524c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #f0eae1;
        }
        .subtitle {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: #a39585;
            margin-bottom: 10px;
        }
        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            color: #4a423a;
            margin-bottom: 15px;
            font-weight: normal;
        }
        .event-type {
            font-size: 1.1rem;
            color: #8c7b6c;
            margin-bottom: 30px;
            font-style: italic;
        }
        .divider {
            height: 1px;
            width: 60px;
            background-color: #d8cebe;
            margin: 20px auto;
        }
        .info-block {
            margin: 20px 0;
        }
        .info-title {
            font-weight: bold;
            color: #6e6154;
            margin-bottom: 5px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #d4c5b3;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(212, 197, 179, 0.4);
        }
        .btn:hover {
            background-color: #c2b19e;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="subtitle">Un giorno speciale</div>
        <h1>Maria Elena</h1>
        <div class="event-type">Battesimo & 1° Compleanno</div>
        
        <div class="divider"></div>

        <p style="line-height: 1.6; margin-bottom: 25px;">
            Siamo felici di invitarvi a condividere con noi la gioia di questa giornata indimenticabile.
        </p>

        <div class="info-block">
            <div class="info-title">📅 QUANDO</div>
            <div>Domenica 24 Gennaio 2027</div>
        </div>

        <div class="divider"></div>

        <a href="https://maps.app.goo.gl/jKzgBme63mTuCwtH6?g_st=ic" target="_blank" class="btn">
            📍 Apri la Mappa
        </a>
    </div>

</body>
</html>
